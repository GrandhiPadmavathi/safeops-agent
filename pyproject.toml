[project]
name = "safeops-agent"
version = "0.1.0"
description = "Tool-using LLM agent with human approval for risky actions, audit log and evals (e-commerce + banking)."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
